blueprint:
  name: IKEA BILRESA Scroll Wheel - 3 Light Presets
  description: |
    Control three independent sets of lights with the IKEA BILRESA scroll wheel remote via Matter.

    Created by @0libote
    GitHub: https://github.com/0libote/HA-BPs

    **Preset 1**
    - Button 1 / Right: brighter
    - Button 2 / Left: dimmer
    - Button 3 / Push: next colour
    - Button 3 / Hold: toggle Preset 1 lights on/off

    **Preset 2**
    - Button 4 / Right: brighter
    - Button 5 / Left: dimmer
    - Button 6 / Push: next colour
    - Button 6 / Hold: toggle Preset 2 lights on/off

    **Preset 3**
    - Button 7 / Right: brighter
    - Button 8 / Left: dimmer
    - Button 9 / Push: next colour
    - Button 9 / Hold: toggle Preset 3 lights on/off

    Brightness and power actions never send colour data.
    Only a normal push of Button 3, 6 or 9 changes colour.
    Brightness and colour actions only affect lights that are already on.

  domain: automation
  source_url: https://github.com/0libote/HA-BPs/blob/main/BILRESA%20scroll%20wheel.YAML

  homeassistant:
    min_version: 2024.6.0

  input:

    # ============================================================
    # PRESET 1
    # ============================================================
    preset_1_section:
      name: Preset 1 - Buttons 1, 2, 3
      icon: mdi:numeric-1-circle
      description: |
        Button 1 = Right / Brighter
        Button 2 = Left / Dimmer
        Button 3 = Push / Next Colour
        Button 3 Hold = On / Off
      input:

        preset_1_lights:
          name: Preset 1 Lights
          description: Lights controlled by Buttons 1, 2 and 3.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        button_1:
          name: Button 1 - Right / Brighter
          selector:
            entity:
              filter:
                - domain: event

        button_2:
          name: Button 2 - Left / Dimmer
          selector:
            entity:
              filter:
                - domain: event

        button_3:
          name: Button 3 - Push / Colour, Hold / Power
          selector:
            entity:
              filter:
                - domain: event


    # ============================================================
    # PRESET 2
    # ============================================================
    preset_2_section:
      name: Preset 2 - Buttons 4, 5, 6
      icon: mdi:numeric-2-circle
      description: |
        Button 4 = Right / Brighter
        Button 5 = Left / Dimmer
        Button 6 = Push / Next Colour
        Button 6 Hold = On / Off
      input:

        preset_2_lights:
          name: Preset 2 Lights
          description: Lights controlled by Buttons 4, 5 and 6.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        button_4:
          name: Button 4 - Right / Brighter
          selector:
            entity:
              filter:
                - domain: event

        button_5:
          name: Button 5 - Left / Dimmer
          selector:
            entity:
              filter:
                - domain: event

        button_6:
          name: Button 6 - Push / Colour, Hold / Power
          selector:
            entity:
              filter:
                - domain: event


    # ============================================================
    # PRESET 3
    # ============================================================
    preset_3_section:
      name: Preset 3 - Buttons 7, 8, 9
      icon: mdi:numeric-3-circle
      description: |
        Button 7 = Right / Brighter
        Button 8 = Left / Dimmer
        Button 9 = Push / Next Colour
        Button 9 Hold = On / Off
      input:

        preset_3_lights:
          name: Preset 3 Lights
          description: Lights controlled by Buttons 7, 8 and 9.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        button_7:
          name: Button 7 - Right / Brighter
          selector:
            entity:
              filter:
                - domain: event

        button_8:
          name: Button 8 - Left / Dimmer
          selector:
            entity:
              filter:
                - domain: event

        button_9:
          name: Button 9 - Push / Colour, Hold / Power
          selector:
            entity:
              filter:
                - domain: event


    # ============================================================
    # COLOUR PRESETS
    # ============================================================
    colour_section:
      name: Colour Presets
      icon: mdi:palette
      description: |
        These colours are shared by all three presets.
        A normal push of Button 3, 6 or 9 cycles the selected preset's lights
        through this list.
      input:

        colour_presets:
          name: Colours to Cycle
          description: Select the colours you want available.
          default:
            - warm_white
            - red
            - green
            - blue
            - purple
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Warm White
                  value: warm_white
                - label: Red
                  value: red
                - label: Orange
                  value: orange
                - label: Yellow
                  value: yellow
                - label: Green
                  value: green
                - label: Cyan
                  value: cyan
                - label: Blue
                  value: blue
                - label: Purple
                  value: purple
                - label: Pink
                  value: pink
                - label: Cool White
                  value: cool_white

        colour_transition:
          name: Colour Transition
          description: Seconds taken to fade into the next colour.
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: slider


    # ============================================================
    # BRIGHTNESS
    # ============================================================
    brightness_section:
      name: Brightness
      icon: mdi:brightness-6
      description: These settings are shared by all three presets.
      input:

        brightness_step:
          name: Brightness Step
          description: Percentage changed for each scroll-wheel event.
          default: 10
          selector:
            number:
              min: 1
              max: 25
              step: 1
              unit_of_measurement: "%"
              mode: slider

        brightness_transition:
          name: Brightness Transition
          description: Seconds taken for each brightness change.
          default: 0.2
          selector:
            number:
              min: 0
              max: 2
              step: 0.1
              unit_of_measurement: s
              mode: slider


# ==============================================================
# AUTOMATION MODE
# ==============================================================

mode: restart
max_exceeded: silent


# ==============================================================
# TRIGGERS
# ==============================================================

trigger:

  # Preset 1
  - platform: state
    entity_id: !input button_1
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_right

  - platform: state
    entity_id: !input button_2
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_left

  - platform: state
    entity_id: !input button_3
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_push

  # Preset 2
  - platform: state
    entity_id: !input button_4
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_right

  - platform: state
    entity_id: !input button_5
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_left

  - platform: state
    entity_id: !input button_6
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_push

  # Preset 3
  - platform: state
    entity_id: !input button_7
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_right

  - platform: state
    entity_id: !input button_8
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_left

  - platform: state
    entity_id: !input button_9
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_push


# ==============================================================
# ACTIONS
# ==============================================================

action:

  - variables:

      # Each BILRESA preset has its own independent light set.
      preset1_lights: !input preset_1_lights
      preset2_lights: !input preset_2_lights
      preset3_lights: !input preset_3_lights

      step_pct: !input brightness_step
      brightness_trans: !input brightness_transition
      colour_trans: !input colour_transition
      chosen_colours: !input colour_presets

      # Work out which preset was used.
      target_lights: >-
        {% if trigger.id in ['preset1_right', 'preset1_left', 'preset1_push'] %}
          {{ preset1_lights }}
        {% elif trigger.id in ['preset2_right', 'preset2_left', 'preset2_push'] %}
          {{ preset2_lights }}
        {% else %}
          {{ preset3_lights }}
        {% endif %}

      # Only brightness/colour-control lights that are already on.
      on_lights: >-
        {{
          expand(target_lights)
          | selectattr('state', 'eq', 'on')
          | map(attribute='entity_id')
          | list
        }}

      any_light_on: >-
        {{ on_lights | count > 0 }}

      # Matter event type from the BILRESA button entity.
      event_type: >-
        {{
          trigger.to_state.attributes.event_type
          if trigger.to_state.attributes.event_type is defined
          else ''
        }}

      # Colour cycle order.
      colour_order:
        - warm_white
        - red
        - orange
        - yellow
        - green
        - cyan
        - blue
        - purple
        - pink
        - cool_white

      colour_map:
        warm_white: [255, 166, 87]
        red: [255, 0, 0]
        orange: [255, 80, 0]
        yellow: [255, 200, 0]
        green: [0, 255, 0]
        cyan: [0, 255, 255]
        blue: [0, 80, 255]
        purple: [160, 0, 255]
        pink: [255, 0, 120]
        cool_white: [220, 235, 255]

      active_colours: >-
        {{ colour_order | select('in', chosen_colours) | list }}


  # Prevent stale Matter events being replayed after a reconnect.
  - condition: template
    value_template: >-
      {{
        trigger.to_state.attributes.event_type is defined
        and trigger.to_state.attributes.event_type != none
        and (now() - trigger.to_state.last_changed).total_seconds() < 5
        and (
          now()
          - (trigger.to_state.state | as_datetime | as_local)
        ).total_seconds() < 5
      }}


  - choose:

      # ========================================================
      # RIGHT: Buttons 1, 4, 7
      # Brightness up only. No colour data is sent.
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_right', 'preset2_right', 'preset3_right']
                and on_lights | count > 0
              }}
        sequence:
          - repeat:
              for_each: "{{ on_lights }}"
              sequence:
                - variables:
                    new_brightness: >-
                      {% set current = state_attr(repeat.item, 'brightness') | int(1) %}
                      {% set raw = current + (255 * (step_pct | float) / 100) %}
                      {{ [255, [1, raw] | max] | min | round(0) | int }}
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness: "{{ new_brightness }}"
                    transition: "{{ brightness_trans }}"


      # ========================================================
      # LEFT: Buttons 2, 5, 8
      # Brightness down only. Minimum is 1, so scrolling cannot
      # turn the lights off. No colour data is sent.
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_left', 'preset2_left', 'preset3_left']
                and on_lights | count > 0
              }}
        sequence:
          - repeat:
              for_each: "{{ on_lights }}"
              sequence:
                - variables:
                    new_brightness: >-
                      {% set current = state_attr(repeat.item, 'brightness') | int(255) %}
                      {% set raw = current - (255 * (step_pct | float) / 100) %}
                      {{ [255, [1, raw] | max] | min | round(0) | int }}
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness: "{{ new_brightness }}"
                    transition: "{{ brightness_trans }}"


      # ========================================================
      # NORMAL PUSH: Buttons 3, 6, 9
      # Change colour only.
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_push', 'preset2_push', 'preset3_push']
                and event_type == 'multi_press_1'
                and on_lights | count > 0
                and active_colours | count > 0
              }}
        sequence:
          - variables:
              reference_light: >-
                {{ on_lights[0] }}

              current_rgb: >-
                {{ state_attr(reference_light, 'rgb_color') }}

              next_rgb: >-
                {% set ns = namespace(best_index=-1, best_distance=999999999) %}

                {% if current_rgb is not none %}
                  {% for colour_name in active_colours %}
                    {% set rgb = colour_map[colour_name] %}
                    {% set red_difference = (current_rgb[0] | int) - (rgb[0] | int) %}
                    {% set green_difference = (current_rgb[1] | int) - (rgb[1] | int) %}
                    {% set blue_difference = (current_rgb[2] | int) - (rgb[2] | int) %}
                    {% set distance =
                      (red_difference * red_difference)
                      + (green_difference * green_difference)
                      + (blue_difference * blue_difference)
                    %}

                    {% if distance < ns.best_distance %}
                      {% set ns.best_distance = distance %}
                      {% set ns.best_index = loop.index0 %}
                    {% endif %}
                  {% endfor %}
                {% endif %}

                {% if ns.best_index == -1 %}
                  {% set next_index = 0 %}
                {% else %}
                  {% set next_index = (ns.best_index + 1) % (active_colours | count) %}
                {% endif %}

                {{ colour_map[active_colours[next_index]] }}

          # This is the only action in the blueprint that sends colour data.
          - action: light.turn_on
            target:
              entity_id: "{{ on_lights }}"
            data:
              rgb_color: "{{ next_rgb }}"
              transition: "{{ colour_trans }}"


      # ========================================================
      # HOLD PUSH: Buttons 3, 6, 9
      # Toggle only the light set assigned to that preset.
      # No colour data is sent.
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_push', 'preset2_push', 'preset3_push']
                and event_type == 'long_press'
              }}
        sequence:
          - choose:
              # If any light in this preset is on, switch the whole set off.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ any_light_on }}
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ target_lights }}"

            # If all lights in this preset are off, switch the whole set on.
            # No colour is supplied, so each light keeps/restores its last colour.
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_lights }}"
