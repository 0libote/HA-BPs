blueprint:
  name: IKEA BILRESA Scroll Wheel - One Light Set
  description: |
    Simple light control for the IKEA BILRESA scroll wheel remote via Matter.

    All 3 BILRESA presets/channels control the SAME set of lights.

    **Preset 1**
    - Button 1 / Right: brighter
    - Button 2 / Left: dimmer
    - Button 3 / Push: next colour preset
    - Button 3 / Hold: toggle lights on/off

    **Preset 2**
    - Button 4 / Right: brighter
    - Button 5 / Left: dimmer
    - Button 6 / Push: next colour preset
    - Button 6 / Hold: toggle lights on/off

    **Preset 3**
    - Button 7 / Right: brighter
    - Button 8 / Left: dimmer
    - Button 9 / Push: next colour preset
    - Button 9 / Hold: toggle lights on/off

    IMPORTANT:
    - Brightness changes NEVER send colour data.
    - Power changes NEVER send colour data.
    - Only a normal Push of Button 3, 6 or 9 changes colour.
    - If the lights are OFF, scrolling or pressing for colour does nothing.
    - Holding Button 3, 6 or 9 is the only action in this blueprint that changes power.

  domain: automation

  homeassistant:
    min_version: 2024.6.0

  input:

    # ============================================================
    # LIGHTS
    # ============================================================
    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      description: |
        Select the light or lights that should behave as one set.

        All three BILRESA presets control these same lights.
      input:

        controlled_lights:
          name: Controlled Lights
          description: Select one or more light entities.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light


    # ============================================================
    # PRESET 1
    # ============================================================
    preset_1_section:
      name: Preset 1 - Buttons 1, 2, 3
      icon: mdi:numeric-1-circle
      description: |
        **Button 1 = Right / Brighter**

        **Button 2 = Left / Dimmer**

        **Button 3 = Push / Next Colour**

        **Button 3 Hold = On / Off**
      input:

        button_1:
          name: Button 1 - Right
          description: Scroll wheel turned right.
          selector:
            entity:
              filter:
                - domain: event

        button_2:
          name: Button 2 - Left
          description: Scroll wheel turned left.
          selector:
            entity:
              filter:
                - domain: event

        button_3:
          name: Button 3 - Push
          description: |
            Normal press = next colour.
            Hold = toggle lights on/off.
          selector:
            entity:
              filter:
                - domain: event


    # ============================================================
    # PRESET 2
    # ============================================================
    preset_2_section:
      name: Preset 2 - Buttons 4, 5, 6
      icon: mdi:numeric-2-circle
      description: |
        **Button 4 = Right / Brighter**

        **Button 5 = Left / Dimmer**

        **Button 6 = Push / Next Colour**

        **Button 6 Hold = On / Off**
      input:

        button_4:
          name: Button 4 - Right
          description: Scroll wheel turned right.
          selector:
            entity:
              filter:
                - domain: event

        button_5:
          name: Button 5 - Left
          description: Scroll wheel turned left.
          selector:
            entity:
              filter:
                - domain: event

        button_6:
          name: Button 6 - Push
          description: |
            Normal press = next colour.
            Hold = toggle lights on/off.
          selector:
            entity:
              filter:
                - domain: event


    # ============================================================
    # PRESET 3
    # ============================================================
    preset_3_section:
      name: Preset 3 - Buttons 7, 8, 9
      icon: mdi:numeric-3-circle
      description: |
        **Button 7 = Right / Brighter**

        **Button 8 = Left / Dimmer**

        **Button 9 = Push / Next Colour**

        **Button 9 Hold = On / Off**
      input:

        button_7:
          name: Button 7 - Right
          description: Scroll wheel turned right.
          selector:
            entity:
              filter:
                - domain: event

        button_8:
          name: Button 8 - Left
          description: Scroll wheel turned left.
          selector:
            entity:
              filter:
                - domain: event

        button_9:
          name: Button 9 - Push
          description: |
            Normal press = next colour.
            Hold = toggle lights on/off.
          selector:
            entity:
              filter:
                - domain: event


    # ============================================================
    # COLOUR SETTINGS
    # ============================================================
    colour_section:
      name: Colour Presets
      icon: mdi:palette
      description: |
        Pick which colours you want the Push button to cycle through.

        Button 3, Button 6 and Button 9 all use this same colour list.

        The colours cycle in the order shown below.
      input:

        colour_presets:
          name: Colours to Cycle
          description: |
            Select as many colours as you want.

            I recommend selecting at least 2.
          default:
            - warm_white
            - red
            - green
            - blue
            - purple
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Warm White
                  value: warm_white

                - label: Red
                  value: red

                - label: Orange
                  value: orange

                - label: Yellow
                  value: yellow

                - label: Green
                  value: green

                - label: Cyan
                  value: cyan

                - label: Blue
                  value: blue

                - label: Purple
                  value: purple

                - label: Pink
                  value: pink

                - label: Cool White
                  value: cool_white

        colour_transition:
          name: Colour Transition
          description: Seconds taken to fade into the next colour.
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: slider


    # ============================================================
    # BRIGHTNESS SETTINGS
    # ============================================================
    brightness_section:
      name: Brightness
      icon: mdi:brightness-6
      description: |
        These brightness settings apply to all three BILRESA presets.
      input:

        brightness_step:
          name: Brightness Step
          description: |
            Percentage changed for each scroll-wheel click.

            Fast scrolling may contain multiple clicks in one Matter event.
            The blueprint accounts for this automatically.
          default: 10
          selector:
            number:
              min: 1
              max: 25
              step: 1
              unit_of_measurement: "%"
              mode: slider

        brightness_transition:
          name: Brightness Transition
          description: Seconds taken for each brightness change.
          default: 0.2
          selector:
            number:
              min: 0
              max: 2
              step: 0.1
              unit_of_measurement: s
              mode: slider


# ==============================================================
# AUTOMATION MODE
# ==============================================================

mode: restart
max_exceeded: silent


# ==============================================================
# TRIGGERS
# ==============================================================

trigger:

  # ------------------------------------------------------------
  # PRESET 1
  # ------------------------------------------------------------

  - platform: state
    entity_id: !input button_1
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_right

  - platform: state
    entity_id: !input button_2
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_left

  - platform: state
    entity_id: !input button_3
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_push


  # ------------------------------------------------------------
  # PRESET 2
  # ------------------------------------------------------------

  - platform: state
    entity_id: !input button_4
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_right

  - platform: state
    entity_id: !input button_5
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_left

  - platform: state
    entity_id: !input button_6
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_push


  # ------------------------------------------------------------
  # PRESET 3
  # ------------------------------------------------------------

  - platform: state
    entity_id: !input button_7
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_right

  - platform: state
    entity_id: !input button_8
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_left

  - platform: state
    entity_id: !input button_9
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_push


# ==============================================================
# ACTIONS
# ==============================================================

action:

  # ------------------------------------------------------------
  # MAIN VARIABLES
  # ------------------------------------------------------------

  - variables:

      lights: !input controlled_lights

      step_pct: !input brightness_step
      brightness_trans: !input brightness_transition

      colour_trans: !input colour_transition
      chosen_colours: !input colour_presets


      # --------------------------------------------------------
      # COLOUR PRESET ORDER
      #
      # Even if the selections come back in a different order,
      # this is the order the remote will cycle through them.
      # --------------------------------------------------------

      colour_order:
        - warm_white
        - red
        - orange
        - yellow
        - green
        - cyan
        - blue
        - purple
        - pink
        - cool_white


      # --------------------------------------------------------
      # COLOUR PRESET RGB VALUES
      # --------------------------------------------------------

      colour_map:
        warm_white: [255, 166, 87]
        red: [255, 0, 0]
        orange: [255, 80, 0]
        yellow: [255, 200, 0]
        green: [0, 255, 0]
        cyan: [0, 255, 255]
        blue: [0, 80, 255]
        purple: [160, 0, 255]
        pink: [255, 0, 120]
        cool_white: [220, 235, 255]


      # --------------------------------------------------------
      # ONLY KEEP COLOURS SELECTED IN THE BLUEPRINT
      # --------------------------------------------------------

      active_colours: >-
        {{ colour_order | select('in', chosen_colours) | list }}


      # --------------------------------------------------------
      # LIGHTS CURRENTLY ON
      #
      # Brightness and colour actions ONLY target lights already
      # on. This means scrolling or changing colour can never
      # accidentally turn an off light on.
      # --------------------------------------------------------

      on_lights: >-
        {{
          expand(lights)
          | selectattr('state', 'eq', 'on')
          | map(attribute='entity_id')
          | list
        }}


      any_light_on: >-
        {{ on_lights | count > 0 }}


      # --------------------------------------------------------
      # EVENT TYPE
      #
      # BILRESA:
      # multi_press_1 = normal single push
      # long_press    = held push
      # --------------------------------------------------------

      event_type: >-
        {{
          trigger.to_state.attributes.event_type
          if trigger.to_state.attributes.event_type is defined
          else ''
        }}


      # --------------------------------------------------------
      # NUMBER OF SCROLL CLICKS
      #
      # BILRESA can combine several wheel clicks into one event.
      # If the attribute is missing we simply treat it as 1.
      # --------------------------------------------------------

      scroll_clicks: >-
        {{
          trigger.to_state.attributes.totalNumberOfPressesCounted
          | int(1)
        }}


      # --------------------------------------------------------
      # TOTAL BRIGHTNESS CHANGE
      #
      # Never allow a single action to exceed 100%.
      # --------------------------------------------------------

      brightness_change: >-
        {{
          [
            (
              (step_pct | float)
              * (scroll_clicks | int(1))
            ),
            100
          ]
          | min
        }}


  # ------------------------------------------------------------
  # STALE EVENT PROTECTION
  #
  # Prevent an old Matter event being replayed when the device,
  # Matter server or Home Assistant reconnects.
  # ------------------------------------------------------------

  - condition: template
    value_template: >-
      {{
        (now() - trigger.to_state.last_changed).total_seconds() < 5

        and

        (
          now()
          -
          (
            trigger.to_state.state
            | as_datetime
            | as_local
          )
        ).total_seconds() < 5
      }}


  # ------------------------------------------------------------
  # BUTTON ACTIONS
  # ------------------------------------------------------------

  - choose:


      # ========================================================
      # RIGHT
      #
      # Buttons:
      # 1
      # 4
      # 7
      #
      # BRIGHTNESS UP
      #
      # IMPORTANT:
      # No colour value is sent.
      # No power-off lights are targeted.
      # ========================================================

      - conditions:

          - condition: template
            value_template: >-
              {{
                trigger.id in
                [
                  'preset1_right',
                  'preset2_right',
                  'preset3_right'
                ]

                and

                on_lights | count > 0
              }}

        sequence:

          - action: light.turn_on

            target:
              entity_id: "{{ on_lights }}"

            data:
              brightness_step_pct: "{{ brightness_change }}"
              transition: "{{ brightness_trans }}"


      # ========================================================
      # LEFT
      #
      # Buttons:
      # 2
      # 5
      # 8
      #
      # BRIGHTNESS DOWN
      #
      # IMPORTANT:
      # No colour value is sent.
      # No power-off lights are targeted.
      # ========================================================

      - conditions:

          - condition: template
            value_template: >-
              {{
                trigger.id in
                [
                  'preset1_left',
                  'preset2_left',
                  'preset3_left'
                ]

                and

                on_lights | count > 0
              }}

        sequence:

          - action: light.turn_on

            target:
              entity_id: "{{ on_lights }}"

            data:
              brightness_step_pct: >-
                {{ 0 - (brightness_change | float) }}

              transition: "{{ brightness_trans }}"


      # ========================================================
      # NORMAL PUSH
      #
      # Buttons:
      # 3
      # 6
      # 9
      #
      # NEXT COLOUR
      #
      # ONLY multi_press_1 changes colour.
      #
      # Holding the button does NOT enter this section.
      # ========================================================

      - conditions:

          - condition: template
            value_template: >-
              {{
                trigger.id in
                [
                  'preset1_push',
                  'preset2_push',
                  'preset3_push'
                ]

                and

                event_type == 'multi_press_1'

                and

                on_lights | count > 0

                and

                active_colours | count > 0
              }}

        sequence:

          # ----------------------------------------------------
          # Work out which colour comes next.
          #
          # We look at the first light that is currently on.
          #
          # The nearest selected preset to its current colour is
          # found, then we move to the next preset.
          #
          # This means small RGB differences reported by the bulb
          # do not break the colour cycle.
          # ----------------------------------------------------

          - variables:

              reference_light: >-
                {{ on_lights[0] }}

              current_rgb: >-
                {{ state_attr(reference_light, 'rgb_color') }}

              next_rgb: >-
                {% set ns = namespace(
                  best_index=-1,
                  best_distance=999999999
                ) %}

                {% if current_rgb is not none %}

                  {% for colour_name in active_colours %}

                    {% set rgb = colour_map[colour_name] %}

                    {% set red_difference =
                      (current_rgb[0] | int)
                      -
                      (rgb[0] | int)
                    %}

                    {% set green_difference =
                      (current_rgb[1] | int)
                      -
                      (rgb[1] | int)
                    %}

                    {% set blue_difference =
                      (current_rgb[2] | int)
                      -
                      (rgb[2] | int)
                    %}

                    {% set distance =
                      (red_difference * red_difference)
                      +
                      (green_difference * green_difference)
                      +
                      (blue_difference * blue_difference)
                    %}

                    {% if distance < ns.best_distance %}

                      {% set ns.best_distance = distance %}
                      {% set ns.best_index = loop.index0 %}

                    {% endif %}

                  {% endfor %}

                {% endif %}


                {% if ns.best_index == -1 %}

                  {% set next_index = 0 %}

                {% else %}

                  {% set next_index =
                    (ns.best_index + 1)
                    %
                    (active_colours | count)
                  %}

                {% endif %}


                {{ colour_map[active_colours[next_index]] }}


          # ----------------------------------------------------
          # THIS IS THE ONLY LIGHT ACTION IN THE BLUEPRINT
          # WHICH CONTAINS COLOUR DATA.
          # ----------------------------------------------------

          - action: light.turn_on

            target:
              entity_id: "{{ on_lights }}"

            data:
              rgb_color: "{{ next_rgb }}"
              transition: "{{ colour_trans }}"


      # ========================================================
      # HOLD PUSH
      #
      # Buttons:
      # 3
      # 6
      # 9
      #
      # TOGGLE WHOLE LIGHT SET
      #
      # If ANY selected light is ON:
      #     Turn ALL lights OFF.
      #
      # If ALL selected lights are OFF:
      #     Turn ALL lights ON.
      #
      # No RGB / colour temperature / HS colour is sent here.
      # ========================================================

      - conditions:

          - condition: template
            value_template: >-
              {{
                trigger.id in
                [
                  'preset1_push',
                  'preset2_push',
                  'preset3_push'
                ]

                and

                event_type == 'long_press'
              }}

        sequence:

          - choose:

              # ------------------------------------------------
              # AT LEAST ONE LIGHT IS ON
              # -> TURN THE WHOLE SET OFF
              # ------------------------------------------------

              - conditions:

                  - condition: template
                    value_template: >-
                      {{ any_light_on }}

                sequence:

                  - action: light.turn_off

                    target:
                      entity_id: "{{ lights }}"


            # --------------------------------------------------
            # ALL LIGHTS ARE OFF
            # -> TURN THE WHOLE SET ON
            #
            # No colour data is supplied, so Home Assistant/light
            # integration can restore the light's existing state.
            # --------------------------------------------------

            default:

              - action: light.turn_on

                target:
                  entity_id: "{{ lights }}"
