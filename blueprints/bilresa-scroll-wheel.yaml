blueprint:
  name: IKEA BILRESA Scroll Wheel - 3 Light Presets
  author: 0libote
  description: |
    Flexible light control for the IKEA BILRESA scroll wheel remote via Matter.

    Created by @0libote
    GitHub: https://github.com/0libote/HA-BPs

    Setup is top-down: pick the 9 remote event entities, pick the lights for
    each preset, then tune the shared wheel and colour feel once.

    Each of the three physical BILRESA presets can:
    - Control its own set of lights.
    - Be disabled.
    - Duplicate another preset's lights and colours.
    - Share one brightness step, range and transition.
    - Share one centre-button layout (Tap = Colour / Hold = Power, or reversed).
    - Use its own ordered colour list with Home Assistant's RGB colour picker.
    - Reorder colours by dragging them in the blueprint editor.

    Presets 2 and 3 duplicate Preset 1 by default, so a single room works after
    configuring Preset 1 only. Switch a preset to a custom profile when it
    should control different lights or cycle different colours.

    Wheel movement uses Matter's totalNumberOfPressesCounted value, so a quick
    multi-detent spin is applied as one larger brightness change. Brightness is
    clamped to the configured minimum and maximum. Scrolling right while the
    preset's lights are off turns them on at the minimum brightness. Tapping
    for colour while off turns them on with the first colour.

    Updating from an older version resets per-preset tuning to the new shared
    Wheel and Colour settings. Re-check those once after updating.

    Important Matter limitation:
    If the BILRESA itself aborts an over-limit multi-press sequence and sends no
    completed event, a blueprint cannot recover that missing movement.

  domain: automation
  source_url: https://github.com/0libote/HA-BPs/blob/main/blueprints/bilresa-scroll-wheel.yaml

  homeassistant:
    min_version: 2025.7.0

  input:

    # ============================================================
    # REMOTE
    # ============================================================
    remote:
      name: Remote buttons
      icon: mdi:remote
      collapsed: false
      description: |
        The 9 BILRESA event entities, three per physical preset. On the device
        page, identify right/brighter, left/dimmer and centre push for each
        preset and confirm they update when the control is used.
      input:

        button_1:
          name: Preset 1 - Right / Brighter
          description: Preset 1 scroll-right event entity.
          default: event.bilresa_unused_preset_1_button_1
          selector:
            entity:
              filter:
                - domain: event

        button_2:
          name: Preset 1 - Left / Dimmer
          description: Preset 1 scroll-left event entity.
          default: event.bilresa_unused_preset_1_button_2
          selector:
            entity:
              filter:
                - domain: event

        button_3:
          name: Preset 1 - Centre Push
          description: Preset 1 centre/push event entity.
          default: event.bilresa_unused_preset_1_button_3
          selector:
            entity:
              filter:
                - domain: event

        button_4:
          name: Preset 2 - Right / Brighter
          description: Preset 2 scroll-right event entity.
          default: event.bilresa_unused_preset_2_button_4
          selector:
            entity:
              filter:
                - domain: event

        button_5:
          name: Preset 2 - Left / Dimmer
          description: Preset 2 scroll-left event entity.
          default: event.bilresa_unused_preset_2_button_5
          selector:
            entity:
              filter:
                - domain: event

        button_6:
          name: Preset 2 - Centre Push
          description: Preset 2 centre/push event entity.
          default: event.bilresa_unused_preset_2_button_6
          selector:
            entity:
              filter:
                - domain: event

        button_7:
          name: Preset 3 - Right / Brighter
          description: Preset 3 scroll-right event entity.
          default: event.bilresa_unused_preset_3_button_7
          selector:
            entity:
              filter:
                - domain: event

        button_8:
          name: Preset 3 - Left / Dimmer
          description: Preset 3 scroll-left event entity.
          default: event.bilresa_unused_preset_3_button_8
          selector:
            entity:
              filter:
                - domain: event

        button_9:
          name: Preset 3 - Centre Push
          description: Preset 3 centre/push event entity.
          default: event.bilresa_unused_preset_3_button_9
          selector:
            entity:
              filter:
                - domain: event

    # ============================================================
    # LIGHTS
    # ============================================================
    lights:
      name: Lights and presets
      icon: mdi:lightbulb-group
      collapsed: false
      description: |
        Pick which lights each preset controls. Duplicating reuses that
        preset's lights and colour list. Disabled presets do nothing.
      input:

        preset_1_mode:
          name: Preset 1 Mode
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: Custom profile
                  value: custom
                - label: Disabled
                  value: disabled

        preset_1_lights:
          name: Preset 1 Lights
          description: Lights controlled by this preset. Ignored when disabled.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        preset_2_mode:
          name: Preset 2 Mode
          default: duplicate_preset_1
          selector:
            select:
              mode: dropdown
              options:
                - label: Duplicate Preset 1 profile
                  value: duplicate_preset_1
                - label: Custom profile
                  value: custom
                - label: Disabled
                  value: disabled

        preset_2_lights:
          name: Preset 2 Lights
          description: Ignored when duplicating Preset 1 or when disabled.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        preset_3_mode:
          name: Preset 3 Mode
          default: duplicate_preset_1
          selector:
            select:
              mode: dropdown
              options:
                - label: Duplicate Preset 1 profile
                  value: duplicate_preset_1
                - label: Duplicate Preset 2 profile
                  value: duplicate_preset_2
                - label: Custom profile
                  value: custom
                - label: Disabled
                  value: disabled

        preset_3_lights:
          name: Preset 3 Lights
          description: Ignored when duplicating another preset or when disabled.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

    # ============================================================
    # WHEEL AND CENTRE BUTTON (SHARED)
    # ============================================================
    wheel:
      name: Wheel and centre button
      icon: mdi:tune
      collapsed: true
      description: |
        Shared feel for every preset. Scrolling right while the lights are off
        turns them on at the minimum brightness.
      input:

        brightness_step:
          name: Brightness Per Wheel Detent
          description: Percentage changed for each reported wheel detent.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
              mode: slider

        brightness_min:
          name: Minimum Brightness
          description: Scrolling left will never go below this percentage.
          default: 1
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        brightness_max:
          name: Maximum Brightness
          description: Scrolling right will never go above this percentage.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        brightness_transition:
          name: Brightness Transition
          default: 0.2
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: slider

        centre_layout:
          name: Centre Button Behaviour
          default: tap_colour_hold_power
          selector:
            select:
              mode: dropdown
              options:
                - label: Tap = Colour / Hold = Power
                  value: tap_colour_hold_power
                - label: Tap = Power / Hold = Colour
                  value: tap_power_hold_colour

    # ============================================================
    # COLOURS
    # ============================================================
    colours:
      name: Colours
      icon: mdi:palette
      collapsed: true
      description: |
        Ordered colour lists. Add colours with the RGB colour picker and drag
        rows into the order the centre button should cycle through. The name is
        only for display. Duplicated presets reuse the source preset's list.
      input:

        preset_1_colour_presets:
          name: Preset 1 Colours to Cycle
          default:
            - name: Warm White
              colour: [255, 166, 87]
            - name: Soft White
              colour: [255, 214, 170]
            - name: Daylight
              colour: [255, 244, 229]
            - name: Red
              colour: [255, 0, 0]
            - name: Orange
              colour: [255, 80, 0]
            - name: Yellow
              colour: [255, 220, 0]
            - name: Green
              colour: [0, 255, 0]
            - name: Cyan
              colour: [0, 255, 255]
            - name: Sky Blue
              colour: [0, 170, 255]
            - name: Blue
              colour: [0, 80, 255]
            - name: Purple
              colour: [160, 0, 255]
            - name: Pink
              colour: [255, 0, 120]
            - name: Cool White
              colour: [220, 235, 255]
          selector:
            object:
              multiple: true
              label_field: name
              description_field: colour
              fields:
                name:
                  label: Name
                  required: true
                  selector:
                    text:
                colour:
                  label: Colour
                  required: true
                  selector:
                    color_rgb:

        preset_2_colour_presets:
          name: Preset 2 Colours to Cycle
          description: Ignored when duplicating Preset 1.
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: colour
              fields:
                name:
                  label: Name
                  required: true
                  selector:
                    text:
                colour:
                  label: Colour
                  required: true
                  selector:
                    color_rgb:

        preset_3_colour_presets:
          name: Preset 3 Colours to Cycle
          description: Ignored when duplicating another preset.
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: colour
              fields:
                name:
                  label: Name
                  required: true
                  selector:
                    text:
                colour:
                  label: Colour
                  required: true
                  selector:
                    color_rgb:

        colour_transition:
          name: Colour Transition
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: slider


# ==============================================================
# AUTOMATION MODE
# ==============================================================

mode: queued
max: 10
max_exceeded: silent


# ==============================================================
# TRIGGERS
# ==============================================================

trigger:

  # Preset 1
  - platform: state
    entity_id: !input button_1
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_right

  - platform: state
    entity_id: !input button_2
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_left

  - platform: state
    entity_id: !input button_3
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset1_centre

  # Preset 2
  - platform: state
    entity_id: !input button_4
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_right

  - platform: state
    entity_id: !input button_5
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_left

  - platform: state
    entity_id: !input button_6
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset2_centre

  # Preset 3
  - platform: state
    entity_id: !input button_7
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_right

  - platform: state
    entity_id: !input button_8
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_left

  - platform: state
    entity_id: !input button_9
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: preset3_centre


# ==============================================================
# ACTIONS
# ==============================================================

action:

  # ------------------------------------------------------------
  # RAW INPUT VALUES
  # ------------------------------------------------------------
  - variables:

      p1_mode: !input preset_1_mode
      p2_mode: !input preset_2_mode
      p3_mode: !input preset_3_mode

      p1_lights: !input preset_1_lights
      p2_lights: !input preset_2_lights
      p3_lights: !input preset_3_lights

      brightness_step: !input brightness_step
      brightness_min: !input brightness_min
      brightness_max: !input brightness_max
      brightness_transition: !input brightness_transition
      centre_layout: !input centre_layout

      p1_colour_presets: !input preset_1_colour_presets
      p2_colour_presets: !input preset_2_colour_presets
      p3_colour_presets: !input preset_3_colour_presets
      colour_transition: !input colour_transition

      # Matter event type. Centre-button matching is permissive on purpose:
      # Matter integrations report tap/hold with different names, so any event
      # containing "long"/"hold" counts as a hold and any press/click/tap
      # counts as a tap. Anything else is ignored.
      event_type: >-
        {{
          trigger.to_state.attributes.event_type
          if trigger.to_state is not none
          and trigger.to_state.attributes.event_type is defined
          else ''
        }}

      # BILRESA reports a burst of wheel detents in this attribute. Clamped so
      # one spin cannot jump further than intended by an extreme value.
      scroll_clicks: >-
        {{
          [[
            trigger.to_state.attributes.totalNumberOfPressesCounted
            | default(1, true)
            | int(1),
            1
          ] | max, 25] | min
          if trigger.to_state is not none
          else 1
        }}

      legacy_colour_order:
        - warm_white
        - red
        - orange
        - yellow
        - green
        - cyan
        - blue
        - purple
        - pink
        - cool_white

      legacy_colour_map:
        warm_white: [255, 166, 87]
        red: [255, 0, 0]
        orange: [255, 80, 0]
        yellow: [255, 200, 0]
        green: [0, 255, 0]
        cyan: [0, 255, 255]
        blue: [0, 80, 255]
        purple: [160, 0, 255]
        pink: [255, 0, 120]
        cool_white: [220, 235, 255]


  # ------------------------------------------------------------
  # WHICH PHYSICAL PRESET FIRED, AND WHICH PROFILE DOES IT USE?
  # ------------------------------------------------------------
  - variables:

      event_type_lower: "{{ (event_type | string | lower) }}"

      trigger_enabled: >-
        {{
          (
            trigger.id in ['preset1_right', 'preset1_left', 'preset1_centre']
            and p1_mode != 'disabled'
          )
          or
          (
            trigger.id in ['preset2_right', 'preset2_left', 'preset2_centre']
            and p2_mode != 'disabled'
          )
          or
          (
            trigger.id in ['preset3_right', 'preset3_left', 'preset3_centre']
            and p3_mode != 'disabled'
          )
        }}

      source_preset: >-
        {% if trigger.id in ['preset1_right', 'preset1_left', 'preset1_centre'] %}
          1

        {% elif trigger.id in ['preset2_right', 'preset2_left', 'preset2_centre'] %}
          {% if p2_mode == 'duplicate_preset_1' %}
            1
          {% else %}
            2
          {% endif %}

        {% else %}
          {% if p3_mode == 'duplicate_preset_1' %}
            1

          {% elif p3_mode == 'duplicate_preset_2' %}
            {% if p2_mode == 'duplicate_preset_1' %}
              1
            {% else %}
              2
            {% endif %}

          {% else %}
            3
          {% endif %}
        {% endif %}

  - variables:

      # A preset that duplicates a disabled profile must also do nothing.
      # This is a separate step so source_preset from above is already set.
      source_enabled: >-
        {{
          (
            source_preset | int == 1
            and p1_mode != 'disabled'
          )
          or
          (
            source_preset | int == 2
            and p2_mode != 'disabled'
            and p2_mode != 'duplicate_preset_1'
          )
          or
          (
            source_preset | int == 3
            and p3_mode != 'disabled'
          )
        }}


  # Disabled presets stop here.
  - condition: template
    value_template: "{{ trigger_enabled | bool and source_enabled | bool }}"


  # ------------------------------------------------------------
  # EFFECTIVE PROFILE SETTINGS
  # ------------------------------------------------------------
  - variables:

      target_lights: >-
        {{
          p1_lights
          if source_preset | int == 1
          else p2_lights
          if source_preset | int == 2
          else p3_lights
        }}

      chosen_colours: >-
        {{
          p1_colour_presets
          if source_preset | int == 1
          else p2_colour_presets
          if source_preset | int == 2
          else p3_colour_presets
        }}


  # ------------------------------------------------------------
  # DERIVED RUNTIME VALUES
  # ------------------------------------------------------------
  - variables:

      on_lights: >-
        {{
          expand(target_lights)
          | selectattr('state', 'eq', 'on')
          | map(attribute='entity_id')
          | list
        }}

      # New configurations contain ordered objects:
      #   - name: Red
      #     colour: [255, 0, 0]
      #
      # Older configurations contain a list of preset-name strings. They are
      # normalised here using the old fixed order, preserving old behaviour.
      active_colours: >-
        {% set ns = namespace(items=[]) %}

        {% if chosen_colours | count > 0 and chosen_colours[0] is string %}

          {% for colour_name in legacy_colour_order %}
            {% if colour_name in chosen_colours and colour_name in legacy_colour_map %}
              {% set ns.items = ns.items + [legacy_colour_map[colour_name]] %}
            {% endif %}
          {% endfor %}

        {% else %}

          {% for item in chosen_colours %}
            {% if
              item is mapping
              and item.colour is defined
              and item.colour | count == 3
            %}
              {% set ns.items = ns.items + [item.colour] %}
            {% endif %}
          {% endfor %}

        {% endif %}

        {{ ns.items }}

      centre_action: >-
        {% if 'long' in event_type_lower or 'hold' in event_type_lower %}
          {% if centre_layout == 'tap_power_hold_colour' %}
            colour
          {% else %}
            power
          {% endif %}
        {% elif 'press' in event_type_lower or 'click' in event_type_lower or 'tap' in event_type_lower or 'single' in event_type_lower or 'double' in event_type_lower or 'multi' in event_type_lower or 'initial' in event_type_lower or 'short' in event_type_lower %}
          {% if centre_layout == 'tap_power_hold_colour' %}
            power
          {% else %}
            colour
          {% endif %}
        {% else %}
          ignore
        {% endif %}


  # ------------------------------------------------------------
  # STALE MATTER EVENT PROTECTION
  # ------------------------------------------------------------
  # Event entities update last_changed on every press. Queued wheel spins can
  # lag a few seconds behind real time, so the window is generous. Without it,
  # an old replayed state after a restart could toggle the lights.
  - condition: template
    value_template: >-
      {{
        trigger.to_state is not none
        and (now() - trigger.to_state.last_changed).total_seconds() < 30
      }}


  # ------------------------------------------------------------
  # ACTION ROUTING
  # ------------------------------------------------------------
  - choose:

      # ========================================================
      # RIGHT - BRIGHTNESS UP
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_right', 'preset2_right', 'preset3_right']
                and target_lights | count > 0
              }}
        sequence:
          - choose:

              # Lights are on: brighten the lights that are on.
              - conditions:
                  - condition: template
                    value_template: "{{ on_lights | count > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ on_lights }}"
                      sequence:

                        - variables:
                            new_brightness_pct: >-
                              {% set current =
                                (state_attr(repeat.item, 'brightness') | int(1))
                                / 255 * 100
                              %}

                              {% set low =
                                [brightness_min | float, brightness_max | float] | min
                              %}

                              {% set high =
                                [brightness_min | float, brightness_max | float] | max
                              %}

                              {% set requested =
                                current
                                + (
                                  (brightness_step | float)
                                  * (scroll_clicks | int(1))
                                )
                              %}

                              {{
                                [
                                  high,
                                  [low, requested] | max
                                ]
                                | min
                                | round(0)
                                | int
                              }}

                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            brightness_pct: "{{ new_brightness_pct }}"
                            transition: "{{ brightness_transition }}"

            # Everything is off: scrolling right wakes the preset at minimum.
            default:
              - variables:
                  wake_brightness_pct: >-
                    {% set low =
                      [brightness_min | float, brightness_max | float] | min
                    %}

                    {% set high =
                      [brightness_min | float, brightness_max | float] | max
                    %}

                    {{
                      [
                        high,
                        [low, brightness_min | float] | max
                      ]
                      | min
                      | round(0)
                      | int
                    }}
              - action: light.turn_on
                target:
                  entity_id: "{{ target_lights }}"
                data:
                  brightness_pct: "{{ wake_brightness_pct }}"
                  transition: "{{ brightness_transition }}"


      # ========================================================
      # LEFT - BRIGHTNESS DOWN
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_left', 'preset2_left', 'preset3_left']
                and on_lights | count > 0
              }}
        sequence:
          - repeat:
              for_each: "{{ on_lights }}"
              sequence:

                - variables:
                    new_brightness_pct: >-
                      {% set current =
                        (state_attr(repeat.item, 'brightness') | int(255))
                        / 255 * 100
                      %}

                      {% set low =
                        [brightness_min | float, brightness_max | float] | min
                      %}

                      {% set high =
                        [brightness_min | float, brightness_max | float] | max
                      %}

                      {% set requested =
                        current
                        - (
                          (brightness_step | float)
                          * (scroll_clicks | int(1))
                        )
                      %}

                      {{
                        [
                          high,
                          [low, requested] | max
                        ]
                        | min
                        | round(0)
                        | int
                      }}

                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_pct: "{{ new_brightness_pct }}"
                    transition: "{{ brightness_transition }}"


      # ========================================================
      # CENTRE BUTTON - POWER
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_centre', 'preset2_centre', 'preset3_centre']
                and centre_action == 'power'
                and target_lights | count > 0
              }}
        sequence:
          - choose:

              - conditions:
                  - condition: template
                    value_template: >-
                      {{
                        expand(target_lights)
                        | selectattr('state', 'eq', 'on')
                        | list
                        | count > 0
                      }}
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      transition: "{{ brightness_transition }}"

            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_lights }}"
                data:
                  transition: "{{ brightness_transition }}"


      # ========================================================
      # CENTRE BUTTON - COLOUR
      # ========================================================
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id in ['preset1_centre', 'preset2_centre', 'preset3_centre']
                and centre_action == 'colour'
                and target_lights | count > 0
                and active_colours | count > 0
              }}
        sequence:
          - choose:

              # Lights are on: advance from the closest colour.
              - conditions:
                  - condition: template
                    value_template: "{{ on_lights | count > 0 }}"
                sequence:

                  - variables:

                      reference_light: >-
                        {{ on_lights[0] }}

                      current_rgb: >-
                        {{ state_attr(reference_light, 'rgb_color') }}

                      next_rgb: >-
                        {% set ns = namespace(
                          best_index=-1,
                          best_distance=999999999
                        ) %}

                        {% if current_rgb is not none %}

                          {% for rgb in active_colours %}

                            {% set red_difference =
                              (current_rgb[0] | int)
                              -
                              (rgb[0] | int)
                            %}

                            {% set green_difference =
                              (current_rgb[1] | int)
                              -
                              (rgb[1] | int)
                            %}

                            {% set blue_difference =
                              (current_rgb[2] | int)
                              -
                              (rgb[2] | int)
                            %}

                            {% set distance =
                              (red_difference * red_difference)
                              +
                              (green_difference * green_difference)
                              +
                              (blue_difference * blue_difference)
                            %}

                            {% if distance < ns.best_distance %}
                              {% set ns.best_distance = distance %}
                              {% set ns.best_index = loop.index0 %}
                            {% endif %}

                          {% endfor %}

                        {% endif %}

                        {% if ns.best_index == -1 %}
                          {% set next_index = 0 %}
                        {% else %}
                          {% set next_index =
                            (ns.best_index + 1)
                            %
                            (active_colours | count)
                          %}
                        {% endif %}

                        {{ active_colours[next_index] }}

                  - action: light.turn_on
                    target:
                      entity_id: "{{ on_lights }}"
                    data:
                      rgb_color: "{{ next_rgb }}"
                      transition: "{{ colour_transition }}"

            # Everything is off: colour tap wakes the preset on the first colour.
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_lights }}"
                data:
                  rgb_color: "{{ active_colours[0] }}"
                  transition: "{{ colour_transition }}"
