blueprint:
  name: IKEA MYGGSPRAY - Smart Motion Lights
  author: 0libote
  description: |
    Smart motion lighting for IKEA MYGGSPRAY Matter-over-Thread sensors and
    other Home Assistant motion detectors.

    Created by @0libote
    GitHub: https://github.com/0libote/HA-BPs

    Behaviour:
    - Starts when any selected motion detector reports motion, every
      selected light is off and available, and (when illuminance sensors
      are selected) at least one valid reading is below the chosen threshold.
      Leave the illuminance selection empty for motion-only detectors.
    - Motion-only detectors are supported; illuminance can be supplied by
      separate detectors that expose light-level entities.
    - Sends brightness and colour in the same light.turn_on call, avoiding an
      intentional "turn on, then dim/recolour" sequence.
    - Turns the lights back off after occupancy has stayed continuously clear
      for the configured time.
    - Remembers each light's latest normal ON brightness/colour while idle and
      can restore that profile immediately before automatic switch-off.
    - Manual/external changes release motion control; OFF always releases it.
    - Recovers from stale session locks when all target lights are already off.
    - Releases control without darkening the room on sensor/light faults.
    - Has a configurable maximum-runtime policy and optional shared manual override.
    - Supports extra user-defined activation conditions.

    Previous-profile memory:
    Home Assistant reports active brightness/colour attributes as null while a
    light is off. Without requiring helpers, this blueprint keeps temporary
    dynamic scenes whenever target lights are normally ON. Profile tracking is
    locked while motion lighting owns the lights, so the automation profile
    cannot overwrite the remembered normal profile.

    Dynamic scenes are temporary. They are cleared by a Home Assistant restart
    or scene reload and are relearned the next time each light is used normally.
    If no profile has been learned yet, cleanup still turns the light off but
    cannot pre-load its previous brightness/colour first.

    Flash prevention:
    Home Assistant cannot generically pre-stage brightness/colour while a light
    is physically off. This blueprint therefore sends brightness and colour in
    one turn_on command. A bulb that itself briefly recalls an old hardware
    state before applying that command cannot be fully prevented by a blueprint.

  domain: automation
  source_url: https://github.com/0libote/HA-BPs/blob/main/blueprints/myggspray-auto-lights.yaml

  homeassistant:
    min_version: 2025.7.0

  input:
    sensors:
      name: MYGGSPRAY Sensors
      icon: mdi:motion-sensor
      collapsed: false
      input:
        motion_sensor:
          name: Motion / Occupancy Sensors
          description: |
            Select one or more motion detectors. They do not need to expose a
            light-level entity; motion from any selected detector can turn the
            lights on.
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: occupancy
                - domain: binary_sensor
                  device_class: motion
                - domain: binary_sensor
                  device_class: presence

        illuminance_sensor:
          name: Illuminance Sensors
          description: |
            Select zero or more light-level entities. These can belong to
            different detectors from the motion sensors. When empty, motion
            always activates regardless of light level. Otherwise the lights
            may turn on when at least one valid reading is below the threshold.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: illuminance

        lux_threshold:
          name: Turn On Below
          description: Motion only activates the lights below this level.
          default: 30
          selector:
            number:
              min: 0
              max: 1000
              step: 1
              unit_of_measurement: lx
              mode: box

    lights:
      name: Lighting
      icon: mdi:lightbulb-group
      collapsed: false
      input:
        target_lights:
          name: Lights
          description: All selected lights must be off before activation.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        brightness_pct:
          name: Automation Brightness
          default: 70
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        colour_mode:
          name: Automation Colour
          description: Keep the bulb's remembered colour, choose RGB, or choose white temperature.
          default: keep
          selector:
            select:
              mode: dropdown
              options:
                - label: Keep previous colour
                  value: keep
                - label: RGB colour
                  value: rgb
                - label: White colour temperature
                  value: temperature

        rgb_colour:
          name: RGB Colour
          description: Used only when Automation Colour is RGB colour.
          default: [255, 214, 170]
          selector:
            color_rgb:

        colour_temperature:
          name: White Colour Temperature
          description: Used only when Automation Colour is White colour temperature.
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500

        turn_on_transition:
          name: Turn On Transition
          description: Zero is usually best for avoiding a visible ramp from an old state.
          default: 0
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: slider

    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: false
      input:
        no_motion_duration:
          name: No Motion Before Off
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:

        maximum_runtime:
          name: Maximum Runtime
          description: Stop owning the lights after this time. By default they remain on; choose forced OFF below only if that is safe for this room.
          default:
            hours: 3
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true

    safety:
      name: Restore & Safety
      icon: mdi:shield-check-outline
      collapsed: true
      input:
        restore_previous_profile:
          name: Remember & Restore Previous Light Profile
          description: |
            Remember the latest normal ON profile while idle. Before automatic
            switch-off, restore it and then turn the light off.
          default: true
          selector:
            boolean:

        respect_manual_changes:
          name: Respect Manual Changes
          description: |
            Release control when a user or another automation changes a light.
            Physical brightness/colour changes are detected
            after a ten-second turn-on settling period. Manual OFF always releases control.
          default: true
          selector:
            boolean:

        runtime_limit_action:
          name: At Maximum Runtime
          description: Release leaves lights on for manual control or the passive safety net. Forced OFF can darken an occupied room.
          default: release
          selector:
            select:
              options:
                - label: Release control and leave lights on
                  value: release
                - label: Force lights off
                  value: turn_off

        manual_override:
          name: Manual Override Helpers (Optional)
          description: Share input_boolean helpers with BILRESA. Any helper ON blocks motion activation and releases an active session. Turn them OFF to resume motion lighting.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean

        extra_activation_conditions:
          name: Extra Activation Conditions
          description: Optional conditions such as schedules, sleep mode, media state, or house mode.
          default: []
          selector:
            condition:

variables:
  motion_sensors: !input motion_sensor
  illuminance_sensors: !input illuminance_sensor
  lux_threshold: !input lux_threshold
  target_lights: !input target_lights
  automation_brightness_pct: !input brightness_pct
  automation_colour_mode: !input colour_mode
  automation_rgb_colour: !input rgb_colour
  automation_colour_temperature: !input colour_temperature
  automation_turn_on_transition: !input turn_on_transition
  restore_previous_profile: !input restore_previous_profile
  respect_manual_changes: !input respect_manual_changes
  manual_override: !input manual_override
  runtime_limit_action: !input runtime_limit_action
  clear_duration: !input no_motion_duration
  runtime_duration: !input maximum_runtime
  active_scene_id: "{{ 'myggspray_' ~ this.entity_id.split('.')[1] ~ '_active' }}"
  active_scene_entity: "{{ 'scene.' ~ active_scene_id }}"

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to:
    id: motion_changed
  - trigger: state
    entity_id: !input target_lights
    id: target_changed
  - trigger: state
    entity_id: !input manual_override
    to:
    id: override_changed
  - trigger: time_pattern
    seconds: "/10"
    id: reconcile
  - trigger: homeassistant
    event: start
    id: reset
  - trigger: event
    event_type: automation_reloaded
    id: reset

conditions: []

actions:
  - alias: Require a real device trigger
    condition: template
    value_template: "{{ trigger is defined and trigger.id is defined }}"

  - variables:
      session_active: "{{ states[active_scene_entity] is not none }}"
      sensors_healthy: >
        {{ motion_sensors | count > 0 and
           expand(motion_sensors) | count >= motion_sensors | unique | list | count and
           expand(motion_sensors) | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 }}
      lights_healthy: >
        {{ target_lights | count > 0 and
           expand(target_lights) | count >= target_lights | unique | list | count and
           expand(target_lights) | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 }}
      override_clear: >
        {{ expand(manual_override) | count >= manual_override | unique | list | count and
           expand(manual_override) | rejectattr('state', 'eq', 'off') | list | count == 0 }}
      clear_seconds: >
        {% if clear_duration is mapping %}
          {% set duration = timedelta(**clear_duration) %}
        {% elif clear_duration is number %}
          {% set duration = timedelta(seconds=clear_duration) %}
        {% else %}
          {% set duration = as_timedelta(clear_duration) %}
        {% endif %}
        {{ [0, duration.total_seconds() if duration is not none else 120] | max }}
      runtime_seconds: >
        {% if runtime_duration is mapping %}
          {% set duration = timedelta(**runtime_duration) %}
        {% elif runtime_duration is number %}
          {% set duration = timedelta(seconds=runtime_duration) %}
        {% else %}
          {% set duration = as_timedelta(runtime_duration) %}
        {% endif %}
        {{ [0, duration.total_seconds() if duration is not none else 10800] | max }}

  - choose:
      - alias: Release ownership after restart or automation reload
        conditions: "{{ trigger.id == 'reset' }}"
        sequence:
          - if: "{{ session_active }}"
            then:
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ active_scene_entity }}"
          - stop: Relearn profiles and require fresh motion after restart/reload.

      - alias: Reconcile an active motion session
        conditions: "{{ session_active }}"
        sequence:
          - variables:
              session_age: >
                {{ as_timestamp(now()) - as_timestamp(states[active_scene_entity].last_changed) }}
              manual_takeover: >
                {% set ns = namespace(takeover=false) %}
                {% if trigger.id == 'target_changed' and trigger.to_state is not none %}
                  {% set new = trigger.to_state %}
                  {% set old = trigger.from_state %}
                  {% set changed = old is not none and
                    (old.state != new.state or
                     old.attributes.get('brightness') != new.attributes.get('brightness') or
                     old.attributes.get('effect') != new.attributes.get('effect') or
                     old.attributes.get('color_mode') != new.attributes.get('color_mode') or
                     old.attributes.get('rgb_color') != new.attributes.get('rgb_color') or
                     old.attributes.get('hs_color') != new.attributes.get('hs_color') or
                     old.attributes.get('xy_color') != new.attributes.get('xy_color') or
                     old.attributes.get('color_temp_kelvin') != new.attributes.get('color_temp_kelvin') or
                     old.attributes.get('color_temp') != new.attributes.get('color_temp')) %}
                  {% if changed and (new.context.user_id is not none or session_age | float(0) > 10) %}
                    {% set ns.takeover = true %}
                  {% endif %}
                {% endif %}
                {{ ns.takeover }}
          - if:
              - condition: template
                value_template: >
                  {{ not sensors_healthy or not lights_healthy or not override_clear or
                     expand(target_lights) | selectattr('state', 'eq', 'off') | list | count > 0 or
                     (respect_manual_changes and manual_takeover) }}
            then:
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ active_scene_entity }}"
              - if: >
                  {{ respect_manual_changes and manual_takeover and restore_previous_profile and
                     trigger.id == 'target_changed' and trigger.to_state is not none and
                     trigger.to_state.state == 'on' and is_state(trigger.entity_id, 'on') }}
                then:
                  - action: scene.create
                    continue_on_error: true
                    data:
                      scene_id: >
                        {{ 'myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                           ~ trigger.entity_id.split('.')[1] ~ '_profile' }}
                      entities: >
                        {{ {trigger.entity_id: dict(trigger.to_state.attributes, state='on')} }}
              - stop: Released ownership after a fault, override or manual change; leave remaining lights alone.

          - variables:
              runtime_expired: "{{ session_age | float(0) >= runtime_seconds | float(0) }}"
              continuously_clear: >
                {% set ns = namespace(clear=true) %}
                {% for sensor in expand(motion_sensors) %}
                  {% if sensor.state != 'off' or
                        as_timestamp(now()) - as_timestamp(sensor.last_changed) < clear_seconds | float(0) %}
                    {% set ns.clear = false %}
                  {% endif %}
                {% endfor %}
                {{ ns.clear and session_age | float(0) >= clear_seconds | float(0) }}
          - condition: template
            value_template: "{{ continuously_clear or runtime_expired }}"
          - if: "{{ runtime_expired and runtime_limit_action == 'release' and not continuously_clear }}"
            then:
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ active_scene_entity }}"
              - stop: Maximum runtime reached; release control without forcing an occupied room dark.

          - alias: Restore learned profiles only while still owning the lights
            if: "{{ restore_previous_profile }}"
            then:
              - repeat:
                  for_each: "{{ target_lights }}"
                  sequence:
                    - alias: Recheck live override and occupancy before changing a light
                      condition: template
                      value_template: >
                        {% set ns = namespace(clear=true) %}
                        {% for sensor in expand(motion_sensors) %}
                          {% if sensor.state != 'off' or
                                as_timestamp(now()) - as_timestamp(sensor.last_changed) < clear_seconds | float(0) %}
                            {% set ns.clear = false %}
                          {% endif %}
                        {% endfor %}
                        {{ is_state(repeat.item, 'on') and
                           expand(motion_sensors) | count == motion_sensors | unique | list | count and
                           expand(motion_sensors) | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 and
                           expand(manual_override) | rejectattr('state', 'eq', 'off') | list | count == 0 and
                           expand(manual_override) | count == manual_override | unique | list | count and
                           (ns.clear or (runtime_expired and runtime_limit_action == 'turn_off')) }}
                    - variables:
                        remembered_scene: >
                          {{ 'scene.myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                             ~ repeat.item.split('.')[1] ~ '_profile' }}
                    - if: "{{ states[remembered_scene] is not none }}"
                      then:
                        - action: scene.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ remembered_scene }}"
          - repeat:
              for_each: "{{ target_lights }}"
              sequence:
                - alias: Recheck live override and occupancy before changing a light
                  condition: template
                  value_template: >
                    {% set ns = namespace(clear=true) %}
                    {% for sensor in expand(motion_sensors) %}
                      {% if sensor.state != 'off' or
                            as_timestamp(now()) - as_timestamp(sensor.last_changed) < clear_seconds | float(0) %}
                        {% set ns.clear = false %}
                      {% endif %}
                    {% endfor %}
                    {{ is_state(repeat.item, 'on') and
                       expand(motion_sensors) | count == motion_sensors | unique | list | count and
                       expand(motion_sensors) | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 and
                       expand(manual_override) | rejectattr('state', 'eq', 'off') | list | count == 0 and
                       expand(manual_override) | count == manual_override | unique | list | count and
                       (ns.clear or (runtime_expired and runtime_limit_action == 'turn_off')) }}
                - action: light.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
          - action: scene.delete
            continue_on_error: true
            target:
              entity_id: "{{ active_scene_entity }}"

      - alias: Remember normal profiles while idle
        conditions: >
          {{ trigger.id == 'target_changed' and restore_previous_profile and
             trigger.to_state is not none and trigger.to_state.state == 'on' and
             is_state(trigger.entity_id, 'on') }}
        sequence:
          - action: scene.create
            continue_on_error: true
            data:
              scene_id: >
                {{ 'myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                   ~ trigger.entity_id.split('.')[1] ~ '_profile' }}
              entities: >
                {{ {trigger.entity_id: dict(trigger.to_state.attributes, state='on')} }}

      - alias: Start only on fresh motion, never from polling or light changes
        conditions: >
          {{ trigger.id == 'motion_changed' and trigger.to_state is not none and
             trigger.to_state.state == 'on' and sensors_healthy and lights_healthy and override_clear and
             expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
        sequence:
          - condition: template
            value_template: >
              {{ expand(target_lights) | rejectattr('state', 'eq', 'off') | list | count == 0 }}
          - condition: template
            value_template: >
              {% set ns = namespace(dark=false) %}
              {% for sensor in expand(illuminance_sensors) %}
                {% if is_number(sensor.state) and sensor.state | float < lux_threshold | float(0) %}
                  {% set ns.dark = true %}
                {% endif %}
              {% endfor %}
              {{ illuminance_sensors | count == 0 or ns.dark }}
          - condition: and
            conditions: !input extra_activation_conditions
          - action: scene.create
            data:
              scene_id: "{{ active_scene_id }}"
              snapshot_entities: "{{ target_lights }}"
          - wait_template: "{{ states[active_scene_entity] is not none }}"
            timeout:
              seconds: 2
            continue_on_timeout: false
          - repeat:
              for_each: "{{ target_lights }}"
              sequence:
                - condition: template
                  value_template: >
                    {{ is_state(repeat.item, 'off') and
                       expand(motion_sensors) | count == motion_sensors | unique | list | count and
                       expand(motion_sensors) | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 and
                       expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 and
                       expand(manual_override) | count == manual_override | unique | list | count and
                       expand(manual_override) | rejectattr('state', 'eq', 'off') | list | count == 0 }}
                - variables:
                    light_data: >
                      {% set base = dict(brightness_pct=automation_brightness_pct,
                                         transition=automation_turn_on_transition) %}
                      {% set modes = state_attr(repeat.item, 'supported_color_modes') or [] %}
                      {% if automation_colour_mode == 'rgb' and
                            modes | select('in', ['rgb', 'rgbw', 'rgbww', 'hs', 'xy']) | list | count > 0 %}
                        {{ dict(base, rgb_color=automation_rgb_colour) }}
                      {% elif automation_colour_mode == 'temperature' and 'color_temp' in modes %}
                        {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}
                        {% set high = state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}
                        {{ dict(base, color_temp_kelvin=[high, [low, automation_colour_temperature | int] | max] | min) }}
                      {% elif modes == ['onoff'] %}
                        {{ dict() }}
                      {% else %}
                        {{ base }}
                      {% endif %}
                - action: light.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data: "{{ light_data }}"
          - alias: Wait for light state feedback or an intervening override/fault
            wait_template: >
              {{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count == target_lights | unique | list | count or
                 expand(manual_override) | count != manual_override | unique | list | count or
                 expand(motion_sensors) | count != motion_sensors | unique | list | count or
                 expand(manual_override) | rejectattr('state', 'eq', 'off') | list | count > 0 or
                 expand(motion_sensors) | rejectattr('state', 'in', ['on', 'off']) | list | count > 0 }}
            timeout:
              seconds: 5
            continue_on_timeout: true
          - if: >
              {{ not wait.completed or
                 expand(target_lights) | selectattr('state', 'eq', 'on') | list | count != target_lights | unique | list | count or
                 expand(manual_override) | count != manual_override | unique | list | count or
                 expand(motion_sensors) | count != motion_sensors | unique | list | count or
                 expand(manual_override) | rejectattr('state', 'eq', 'off') | list | count > 0 or
                 expand(motion_sensors) | rejectattr('state', 'in', ['on', 'off']) | list | count > 0 }}
            then:
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ active_scene_entity }}"
              - stop: Activation was incomplete or interrupted; release control and leave lights alone.

mode: queued
max: 100
max_exceeded: warning
trace:
  stored_traces: 20
