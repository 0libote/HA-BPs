blueprint:
  name: IKEA MYGGSPRAY - Smart Motion Lights
  author: 0libote
  description: |
    Smart motion lighting for the IKEA MYGGSPRAY Matter-over-Thread
    occupancy and illuminance sensor.

    Created by @0libote
    GitHub: https://github.com/0libote/HA-BPs

    Behaviour:
    - Starts only when motion is detected, illuminance is below the chosen
      threshold, and every selected light is off and available.
    - Sends brightness and colour in the same light.turn_on call, avoiding an
      intentional "turn on, then dim/recolour" sequence.
    - Turns the lights back off after occupancy has stayed continuously clear
      for the configured time.
    - Remembers each light's latest normal ON brightness/colour while idle and
      can restore that profile immediately before automatic switch-off.
    - Manual/external OFF immediately releases the current motion-light session.
    - Recovers from stale session locks when all target lights are already off.
    - Cleans up after sensor/light faults and has a maximum-runtime failsafe.
    - Supports extra user-defined activation conditions.

    Previous-profile memory:
    Home Assistant reports active brightness/colour attributes as null while a
    light is off. Without requiring helpers, this blueprint keeps temporary
    dynamic scenes whenever target lights are normally ON. Profile tracking is
    locked while motion lighting owns the lights, so the automation profile
    cannot overwrite the remembered normal profile.

    Dynamic scenes are temporary. They are cleared by a Home Assistant restart
    or scene reload and are relearned the next time each light is used normally.
    If no profile has been learned yet, cleanup still turns the light off but
    cannot pre-load its previous brightness/colour first.

    Flash prevention:
    Home Assistant cannot generically pre-stage brightness/colour while a light
    is physically off. This blueprint therefore sends brightness and colour in
    one turn_on command. A bulb that itself briefly recalls an old hardware
    state before applying that command cannot be fully prevented by a blueprint.

  domain: automation
  source_url: https://github.com/0libote/HA-BPs/blob/main/blueprints/myggspray-auto-lights.yaml

  homeassistant:
    min_version: 2025.7.0

  input:
    sensors:
      name: MYGGSPRAY Sensors
      icon: mdi:motion-sensor
      collapsed: false
      input:
        motion_sensor:
          name: Motion / Occupancy Sensor
          description: Select the MYGGSPRAY occupancy entity.
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: occupancy
                - domain: binary_sensor
                  device_class: motion

        illuminance_sensor:
          name: Illuminance Sensor
          description: Select the MYGGSPRAY illuminance entity.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance

        lux_threshold:
          name: Turn On Below
          description: Motion only activates the lights below this level.
          default: 30
          selector:
            number:
              min: 0
              max: 1000
              step: 1
              unit_of_measurement: lx
              mode: box

    lights:
      name: Lighting
      icon: mdi:lightbulb-group
      collapsed: false
      input:
        target_lights:
          name: Lights
          description: All selected lights must be off before activation.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light

        brightness_pct:
          name: Automation Brightness
          default: 70
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        colour_mode:
          name: Automation Colour
          description: Keep the bulb's remembered colour, choose RGB, or choose white temperature.
          default: keep
          selector:
            select:
              mode: dropdown
              options:
                - label: Keep previous colour
                  value: keep
                - label: RGB colour
                  value: rgb
                - label: White colour temperature
                  value: temperature

        rgb_colour:
          name: RGB Colour
          description: Used only when Automation Colour is RGB colour.
          default: [255, 214, 170]
          selector:
            color_rgb:

        colour_temperature:
          name: White Colour Temperature
          description: Used only when Automation Colour is White colour temperature.
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500

        turn_on_transition:
          name: Turn On Transition
          description: Zero is usually best for avoiding a visible ramp from an old state.
          default: 0
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: slider

    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: false
      input:
        no_motion_duration:
          name: No Motion Before Off
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:

        maximum_runtime:
          name: Maximum Runtime
          description: Safety timeout for a stuck sensor or missed clear event.
          default:
            hours: 3
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true

    safety:
      name: Restore & Safety
      icon: mdi:shield-check-outline
      collapsed: true
      input:
        restore_previous_profile:
          name: Remember & Restore Previous Light Profile
          description: |
            Remember the latest normal ON profile while idle. Before automatic
            switch-off, restore it and then turn the light off.
          default: true
          selector:
            boolean:

        respect_manual_changes:
          name: Respect Manual Changes
          description: |
            Retained for compatibility with existing automations. Manual OFF is
            always treated as a release of motion-light control in this version.
            Richer brightness/colour takeover detection will be reintroduced only
            after the core motion lifecycle is proven reliable.
          default: true
          selector:
            boolean:

        extra_activation_conditions:
          name: Extra Activation Conditions
          description: Optional conditions such as schedules, sleep mode, media state, or house mode.
          default: []
          selector:
            condition:

variables:
  motion_sensor: !input motion_sensor
  illuminance_sensor: !input illuminance_sensor
  lux_threshold: !input lux_threshold
  target_lights: !input target_lights
  automation_brightness_pct: !input brightness_pct
  automation_colour_mode: !input colour_mode
  automation_rgb_colour: !input rgb_colour
  automation_colour_temperature: !input colour_temperature
  automation_turn_on_transition: !input turn_on_transition
  restore_previous_profile: !input restore_previous_profile
  respect_manual_changes: !input respect_manual_changes
  active_scene_id: "{{ 'myggspray_' ~ this.entity_id.split('.')[1] ~ '_active' }}"
  active_scene_entity: "{{ 'scene.myggspray_' ~ this.entity_id.split('.')[1] ~ '_active' }}"

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    id: motion_off

  - platform: state
    entity_id: !input motion_sensor
    to: "unavailable"
    for:
      seconds: 30
    id: motion_fault

  - platform: state
    entity_id: !input motion_sensor
    to: "unknown"
    for:
      seconds: 30
    id: motion_fault

  - platform: state
    entity_id: !input target_lights
    id: target_changed

  - platform: state
    entity_id: !input target_lights
    to: "unavailable"
    for:
      seconds: 30
    id: light_fault

condition: []

action:
  - choose:
      - alias: Track normal profiles and manual OFF
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'target_changed' }}"
        sequence:
          - choose:
              - alias: OFF means the motion session no longer owns the lights
                conditions:
                  - condition: template
                    value_template: >
                      {{ active_scene_entity in
                         (states.scene | map(attribute='entity_id') | list) }}
                  - condition: template
                    value_template: >
                      {{ trigger.to_state is not none
                         and trigger.to_state.state == 'off' }}
                sequence:
                  - action: scene.delete
                    continue_on_error: true
                    target:
                      entity_id: "{{ active_scene_entity }}"

              - alias: Remember a normal ON profile while idle
                conditions:
                  - condition: template
                    value_template: "{{ restore_previous_profile }}"
                  - condition: template
                    value_template: >
                      {{ active_scene_entity not in
                         (states.scene | map(attribute='entity_id') | list) }}
                  - condition: template
                    value_template: >
                      {{ trigger.to_state is not none
                         and trigger.to_state.state == 'on' }}
                sequence:
                  - variables:
                      profile_scene_id: >
                        {{ 'myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                           ~ trigger.entity_id.split('.')[1] ~ '_profile' }}
                  - action: scene.create
                    continue_on_error: true
                    data:
                      scene_id: "{{ profile_scene_id }}"
                      snapshot_entities:
                        - "{{ trigger.entity_id }}"

      - alias: Start motion lighting
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'motion_on' }}"
        sequence:
          - alias: Recover stale ownership if every target light is already off
            if:
              - condition: template
                value_template: >
                  {{ active_scene_entity in
                     (states.scene | map(attribute='entity_id') | list)
                     and (target_lights | count) > 0
                     and (expand(target_lights)
                          | rejectattr('state', 'eq', 'off')
                          | list | count) == 0 }}
            then:
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ active_scene_entity }}"

          - condition: template
            value_template: >
              {{ active_scene_entity not in
                 (states.scene | map(attribute='entity_id') | list) }}

          - condition: template
            value_template: "{{ is_state(motion_sensor, 'on') }}"

          - condition: template
            value_template: >
              {% set lux = states(illuminance_sensor) %}
              {{ lux not in ['unknown', 'unavailable', 'none', '']
                 and (lux | float(999999)) < (lux_threshold | float(0)) }}

          - condition: template
            value_template: >
              {{ (target_lights | count) > 0
                 and (expand(target_lights)
                      | rejectattr('state', 'eq', 'off')
                      | list | count) == 0 }}

          - condition: and
            conditions: !input extra_activation_conditions

          - alias: Lock profile tracking for this session
            action: scene.create
            continue_on_error: true
            data:
              scene_id: "{{ active_scene_id }}"
              snapshot_entities:
                - "{{ motion_sensor }}"

          - condition: template
            value_template: >
              {{ active_scene_entity in
                 (states.scene | map(attribute='entity_id') | list) }}

          - alias: Apply brightness and colour in one turn-on call
            choose:
              - conditions:
                  - condition: template
                    value_template: "{{ automation_colour_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      brightness_pct: "{{ automation_brightness_pct }}"
                      rgb_color: "{{ automation_rgb_colour }}"
                      transition: "{{ automation_turn_on_transition }}"

              - conditions:
                  - condition: template
                    value_template: "{{ automation_colour_mode == 'temperature' }}"
                sequence:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      brightness_pct: "{{ automation_brightness_pct }}"
                      color_temp_kelvin: "{{ automation_colour_temperature }}"
                      transition: "{{ automation_turn_on_transition }}"

            default:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ target_lights }}"
                data:
                  brightness_pct: "{{ automation_brightness_pct }}"
                  transition: "{{ automation_turn_on_transition }}"

          - wait_template: >
              {{ (expand(target_lights) | selectattr('state', 'eq', 'on')
                  | list | count) == (target_lights | count) }}
            timeout:
              seconds: 5
            continue_on_timeout: true

          - alias: Abort cleanly if a target light failed to report ON
            if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ target_lights }}"
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ active_scene_entity }}"
              - stop: One or more target lights failed to report ON.

          - alias: Wait for normal cleanup, with a maximum-runtime failsafe
            wait_template: >
              {{ active_scene_entity not in
                 (states.scene | map(attribute='entity_id') | list) }}
            timeout: !input maximum_runtime
            continue_on_timeout: true

          - alias: Stop this failsafe run if the session already ended normally
            if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - stop: Motion-light session ended before maximum runtime.

          - condition: template
            value_template: >
              {{ active_scene_entity in
                 (states.scene | map(attribute='entity_id') | list) }}

          - alias: Restore remembered profiles before maximum-runtime OFF
            if:
              - condition: template
                value_template: "{{ restore_previous_profile }}"
            then:
              - repeat:
                  for_each: "{{ target_lights }}"
                  sequence:
                    - variables:
                        remembered_scene_entity: >
                          {{ 'scene.myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                             ~ repeat.item.split('.')[1] ~ '_profile' }}
                    - if:
                        - condition: template
                          value_template: >
                            {{ remembered_scene_entity in
                               (states.scene | map(attribute='entity_id') | list) }}
                      then:
                        - action: scene.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ remembered_scene_entity }}"
                          data:
                            transition: 0

          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ target_lights }}"

          - action: scene.delete
            continue_on_error: true
            target:
              entity_id: "{{ active_scene_entity }}"

      - alias: End motion lighting after continuous clear time
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'motion_off' }}"
        sequence:
          - condition: template
            value_template: >
              {{ active_scene_entity in
                 (states.scene | map(attribute='entity_id') | list) }}

          - delay: !input no_motion_duration

          - condition: template
            value_template: "{{ is_state(motion_sensor, 'off') }}"

          - alias: Ignore an old OFF countdown if motion changed since it began
            condition: template
            value_template: >
              {{ trigger.to_state.last_changed == states[motion_sensor].last_changed }}

          - condition: template
            value_template: >
              {{ active_scene_entity in
                 (states.scene | map(attribute='entity_id') | list) }}

          - alias: Restore remembered profiles before automatic OFF
            if:
              - condition: template
                value_template: "{{ restore_previous_profile }}"
            then:
              - repeat:
                  for_each: "{{ target_lights }}"
                  sequence:
                    - variables:
                        remembered_scene_entity: >
                          {{ 'scene.myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                             ~ repeat.item.split('.')[1] ~ '_profile' }}
                    - if:
                        - condition: template
                          value_template: >
                            {{ remembered_scene_entity in
                               (states.scene | map(attribute='entity_id') | list) }}
                      then:
                        - action: scene.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ remembered_scene_entity }}"
                          data:
                            transition: 0

          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ target_lights }}"

          - action: scene.delete
            continue_on_error: true
            target:
              entity_id: "{{ active_scene_entity }}"

      - alias: Clean up safely after a sensor or light fault
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['motion_fault', 'light_fault'] }}"
        sequence:
          - condition: template
            value_template: >
              {{ active_scene_entity in
                 (states.scene | map(attribute='entity_id') | list) }}

          - alias: Restore remembered profiles before fault cleanup
            if:
              - condition: template
                value_template: "{{ restore_previous_profile }}"
            then:
              - repeat:
                  for_each: "{{ target_lights }}"
                  sequence:
                    - variables:
                        remembered_scene_entity: >
                          {{ 'scene.myggspray_' ~ this.entity_id.split('.')[1] ~ '_'
                             ~ repeat.item.split('.')[1] ~ '_profile' }}
                    - if:
                        - condition: template
                          value_template: >
                            {{ remembered_scene_entity in
                               (states.scene | map(attribute='entity_id') | list) }}
                      then:
                        - action: scene.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ remembered_scene_entity }}"
                          data:
                            transition: 0

          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ target_lights }}"

          - action: scene.delete
            continue_on_error: true
            target:
              entity_id: "{{ active_scene_entity }}"

mode: parallel
max: 50
max_exceeded: silent
