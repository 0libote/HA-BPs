name: Blueprint tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static blueprint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install pytest PyYAML yamllint

      - name: Lint YAML
        shell: bash
        run: |
          find . -type f \( -iname '*.yaml' -o -iname '*.yml' \) \
            -not -path './.git/*' \
            -print0 \
            | xargs -0 --no-run-if-empty yamllint \
              -d '{extends: relaxed, rules: {line-length: disable, new-line-at-end-of-file: disable}}'

      - name: Run repository tests
        run: python -m pytest -q

  home-assistant:
    name: Home Assistant schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all blueprints with Home Assistant stable
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/home-assistant/home-assistant:stable \
            python /repo/tests/validate_with_homeassistant.py
