name: Blueprint tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static blueprint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install pytest PyYAML yamllint

      - name: Lint YAML
        shell: bash
        run: |
          find . -type f \( -iname '*.yaml' -o -iname '*.yml' \) \
            -not -path './.git/*' \
            -print0 \
            | xargs -0 --no-run-if-empty yamllint \
              -d '{extends: relaxed, rules: {line-length: disable, new-line-at-end-of-file: disable}}'

      - name: Run repository tests
        run: python -m pytest -q

  home-assistant:
    name: Home Assistant ${{ matrix.version }} validation and regressions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["2025.7.4", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Validate expanded automations
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.version }} \
            python /repo/tests/validate_with_homeassistant.py

      - name: Exercise runtime regression scenarios
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.version }} \
            python /repo/tests/exercise_with_homeassistant.py

      - name: Exercise delayed responses and interleaved actions
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.version }} \
            python /repo/tests/exercise_async_with_homeassistant.py

  website:
    name: Website catalogue, exports and build
    runs-on: ubuntu-latest
    container: oven/bun:1.4.2-slim
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run data:build
      - run: bun run test
      - run: bun run build
