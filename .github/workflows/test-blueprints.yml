name: Blueprint tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest PyYAML yamllint
      - name: Lint blueprint YAML
        run: |
          find . -maxdepth 1 -type f \( -iname '*.yaml' -o -iname '*.yml' \) -print0 | xargs -0 --no-run-if-empty yamllint -d '{extends: relaxed, rules: {line-length: disable}}'
      - name: Run structure tests
        run: python -m pytest -q tests
